<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary icon -->
    <link rel="icon" href="/favicon.ico" sizes="any">

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google / Android Web App -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png" />

    <!-- App name (used by Chrome / Android) -->
    <meta name="application-name" content="LMC Vacuum Glazing" />
    <meta name="apple-mobile-web-app-title" content="LMC Vacuum Glazing" />

    <!-- Mobile theme color -->
    <meta name="theme-color" content="#ffffff" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LMC Vacuum Glazing | Vacuum Glazing Merchant</title>

    <meta
      name="description"
      content="LMC Vacuum Glazing provides high-performance vacuum glass 
               solutions for architecture, heritage buildings, agriculture, 
               and energy-efficient construction."
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- normal client entry -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- prerender entry (only used at build time by the plugin) -->
    <script type="module" prerender src="/src/prerender.jsx"></script>
  </body>
</html>
